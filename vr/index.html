<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#041E42">
  <title>Construmart · Historias de pasillo — VR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body class="bg-cm-navy text-white no-select">
  <div class="cm-stripes h-1.5 w-full"></div>

  <main class="screen">
    <img src="/logo-construmart.png" alt="Construmart" class="w-48 max-w-[55vw] mb-8 brightness-0 invert" />

    <div class="mb-3 text-white/70 text-[11px] tracking-[0.35em] font-semibold">PRESENTA</div>

    <h1 class="font-display uppercase text-cm-yellow text-[9vw] md:text-5xl font-extrabold leading-[0.95] tracking-tight mb-2">
      Tu primera vez<br>
      en Construmart Arica
    </h1>
    <div class="cm-stripes h-1 w-32 mb-6"></div>

    <p class="max-w-md text-white/85 mb-2 font-semibold">
      Cada pasillo tiene una historia. Encuéntrala.
    </p>
    <p class="max-w-md text-white/60 mb-10 text-sm">
      Explora la tienda en 360° y descubre las 3 historias escondidas entre los productos.
    </p>

    <button
      id="start-btn"
      class="btn-pulse bg-cm-yellow text-cm-navy font-extrabold text-lg px-10 py-4 rounded-md shadow-lg active:scale-95 transition font-display uppercase tracking-wide"
    >
      Iniciar experiencia
    </button>

    <div class="mt-12 text-[10px] text-white/30 tracking-widest">
      EXPERIENCIA POR UV AGENCY
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
