<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#041E42" />
    <title>Construmart — Conoce la Tienda Antes de que Abra</title>

    <!-- Google Analytics 4 (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S8P46JNW2C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());

      // "experiencia" según la URL: la experiencia mobile vive en la raíz del
      // dominio y la VR se sirve bajo /vr. (Este build es el de /vr, así que en
      // producción siempre será 'vr'; el MISMO tag puesto en el sitio raíz —el
      // otro repo— reportará 'mobile'. OJO: en dev local el base es '/', no
      // '/vr', así que las pruebas locales se etiquetan 'mobile'.)
      var experiencia = window.location.pathname.startsWith('/vr') ? 'vr' : 'mobile';
      // Disponible para los eventos del recorrido (router) sin recalcular.
      window.__experiencia = experiencia;

      // Propiedad de usuario: marca toda la sesión como vr / mobile (registrar en
      // GA4 → Administrar → Definiciones personalizadas una dimensión de ámbito
      // USUARIO con nombre de parámetro "experiencia").
      gtag('set', 'user_properties', { experiencia: experiencia });
      gtag('config', 'G-S8P46JNW2C');
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;700&display=swap" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Experiencia MOBILE: selección por TAP (componente tap-select), sin botón
         de gafas WebXR (vr-mode-ui off) — la versión VR vive en el otro repo.
         device-orientation-permission-ui off: el modal de permiso por defecto de
         A-Frame (iOS) es feo y se superpone con nuestro pedido. Pedimos el permiso
         del giroscopio nosotros, una sola vez, en el tap de "ENTRAR A LA TIENDA"
         (src/state/motion.ts) — queda solo el diálogo nativo del sistema. -->
    <a-scene
      id="scene"
      background="color: #041E42"
      renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      tap-select
    >
      <a-assets id="assets"></a-assets>

      <!--
        Rig en (0,0,0) + camera con position explícita 0 1.6 0 = patrón estándar
        A-Frame para WebXR + non-XR coherente. Si el rig tuviera y=1.6 y el
        camera y=0, el `user-height` default de a-camera en non-XR sumaría OTRO
        1.6 al world Y → eye terminaba a ~3.2, descentrando el menú.
      -->
      <a-entity id="rig" position="0 0 0">
        <a-camera id="camera" position="0 1.6 0" look-controls="pointerLockEnabled: false; touchEnabled: true; magicWindowTrackingEnabled: true">
          <!--
            Sin retícula central: en mobile la selección es por TAP directo sobre
            el botón (componente tap-select en <a-scene>), no por mirada. El
            usuario gira el teléfono (giroscopio / arrastre) para encontrar cada
            botón —incluido "PASILLO ANTERIOR", a sus espaldas— y lo toca.
          -->

          <a-plane
            id="fader"
            position="0 0 -0.3"
            width="3"
            height="3"
            color="#000000"
            material="shader: flat; opacity: 0; transparent: true; depthTest: false; depthWrite: false"
            visible="false"
            render-order="1000"
          ></a-plane>
        </a-camera>
      </a-entity>

      <a-entity id="scene-root"></a-entity>
    </a-scene>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
